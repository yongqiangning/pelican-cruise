<!--
  插件图标的单一来源。图形与 index.template.html 里内联的 <link rel="icon"> 完全一致
  （白身鹈鹕 + 青蓝车轮 + 橙喙，透明底），改这里之后跑 tools/make-icons.sh 重出 4 个尺寸。
  注意：游戏 / 壁纸那两份 HTML 是单文件分发，favicon 必须内联 data URI，
  所以那边是一份拷贝，改动时要一起同步。
-->
