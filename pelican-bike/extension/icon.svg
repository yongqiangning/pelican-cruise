  <circle cx="48" cy="48" r="11" fill="none" stroke="#138a8a" stroke-width="5" />
  <ellipse cx="26" cy="26" rx="13" ry="9" fill="#f6f3ec" />
  <circle cx="38" cy="12" r="6" fill="#f6f3ec" />
  <path d="M42 11 L62 17 L42 17 Z" fill="#f5b857" />
</svg>
